{{- if and .Values.grafana.enabled .Values.grafana.dashboards.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /etc/grafana/provisioning/dashboards
  containers.json: |
    {
      "title": "Container Statistics",
      "uid": "containerwatch-containers",
      "tags": ["containers", "containerwatch", "alloy"],
      "timezone": "",
      "links": [
        {
          "type": "dashboards",
          "title": "ContainerWatch dashboards",
          "tags": ["containerwatch"],
          "asDropdown": true,
          "includeVars": true,
          "keepTime": true,
          "icon": "external link"
        }
      ],
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "graphTooltip": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": {
              "query": "label_values(container_last_seen{image!=\"\"}, container_label_io_kubernetes_pod_namespace)",
              "refId": "StandardVariableQuery"
            },
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "current": { "text": "All", "value": "$__all" }
          },
          {
            "name": "show_system",
            "type": "custom",
            "label": "Show system namespaces",
            "query": "Off : kube-system|kube-public|kube-node-lease|flux-system,On : .^",
            "current": { "text": "Off", "value": "kube-system|kube-public|kube-node-lease|flux-system" }
          }
        ]
      },
      "panels": [
        {
          "type": "stat",
          "title": "Containers Running",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "count(container_last_seen{image!=\"\", container_label_io_cri_containerd_kind=\"container\", container_label_io_kubernetes_pod_namespace=~\"$namespace\", container_label_io_kubernetes_pod_namespace!~\"$show_system\"})", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "value" }
        },
        {
          "type": "stat",
          "title": "Total CPU Cores Used",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(rate(container_cpu_usage_seconds_total{image!=\"\", container_label_io_cri_containerd_kind=\"container\", container_label_io_kubernetes_pod_namespace=~\"$namespace\", container_label_io_kubernetes_pod_namespace!~\"$show_system\"}[5m]))", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "color": { "mode": "thresholds" } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "value" }
        },
        {
          "type": "stat",
          "title": "Total Memory Used",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(container_memory_usage_bytes{image!=\"\", container_label_io_cri_containerd_kind=\"container\", container_label_io_kubernetes_pod_namespace=~\"$namespace\", container_label_io_kubernetes_pod_namespace!~\"$show_system\"})", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes", "color": { "mode": "thresholds" } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "value" }
        },
        {
          "type": "stat",
          "title": "Nodes Reporting",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "count(count by (instance) (container_last_seen))", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" } }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "value" }
        },
        {
          "type": "timeseries",
          "title": "CPU Usage by Container",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum by (container_label_io_kubernetes_pod_namespace, container_label_io_kubernetes_pod_name, container_label_io_kubernetes_container_name) (rate(container_cpu_usage_seconds_total{image!=\"\", container_label_io_cri_containerd_kind=\"container\", container_label_io_kubernetes_pod_namespace=~\"$namespace\", container_label_io_kubernetes_pod_namespace!~\"$show_system\"}[5m]))",
              "legendFormat": "{{ `{{container_label_io_kubernetes_pod_namespace}}/{{container_label_io_kubernetes_pod_name}}/{{container_label_io_kubernetes_container_name}}` }}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Memory Usage by Container",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum by (container_label_io_kubernetes_pod_namespace, container_label_io_kubernetes_pod_name, container_label_io_kubernetes_container_name) (container_memory_usage_bytes{image!=\"\", container_label_io_cri_containerd_kind=\"container\", container_label_io_kubernetes_pod_namespace=~\"$namespace\", container_label_io_kubernetes_pod_namespace!~\"$show_system\"})",
              "legendFormat": "{{ `{{container_label_io_kubernetes_pod_namespace}}/{{container_label_io_kubernetes_pod_name}}/{{container_label_io_kubernetes_container_name}}` }}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Network I/O by Container",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "Bps" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum by (container_label_io_kubernetes_pod_name) (rate(container_network_receive_bytes_total{image!=\"\", container_label_io_cri_containerd_kind=\"container\", container_label_io_kubernetes_pod_namespace=~\"$namespace\", container_label_io_kubernetes_pod_namespace!~\"$show_system\"}[5m]))",
              "legendFormat": "{{ `{{container_label_io_kubernetes_pod_name}} rx` }}",
              "refId": "A"
            },
            {
              "expr": "sum by (container_label_io_kubernetes_pod_name) (rate(container_network_transmit_bytes_total{image!=\"\", container_label_io_cri_containerd_kind=\"container\", container_label_io_kubernetes_pod_namespace=~\"$namespace\", container_label_io_kubernetes_pod_namespace!~\"$show_system\"}[5m]))",
              "legendFormat": "{{ `{{container_label_io_kubernetes_pod_name}} tx` }}",
              "refId": "B"
            }
          ]
        },
        {
          "type": "table",
          "title": "Container Status",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "(time() - container_last_seen{image!=\"\", container_label_io_cri_containerd_kind=\"container\", container_label_io_kubernetes_pod_namespace=~\"$namespace\", container_label_io_kubernetes_pod_namespace!~\"$show_system\"}) < 60",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "transformations": [
            {
              "id": "filterFieldsByName",
              "options": {
                "include": {
                  "pattern": "^(container_label_io_kubernetes_pod_namespace|container_label_io_kubernetes_pod_name|container_label_io_kubernetes_container_name|image)$"
                }
              }
            },
            {
              "id": "organize",
              "options": {
                "renameByName": {
                  "container_label_io_kubernetes_pod_namespace": "Namespace",
                  "container_label_io_kubernetes_pod_name": "Pod",
                  "container_label_io_kubernetes_container_name": "Container",
                  "image": "Image"
                }
              }
            }
          ]
        }
      ]
    }
